<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container form-container">
    <h2>Admin Dashboard - Add Event</h2>
    <form id="eventForm">
      <input type="text" id="title" placeholder="Event Title" required>
      <input type="date" id="date" required>
      <input type="text" id="time" placeholder="Time (e.g. 10:00 AM)" required>
      <textarea id="desc" placeholder="Event Description" required></textarea>
      <button type="submit" class="btn">Add Event</button>
    </form>

    <h3 style="margin-top: 30px;">Existing Events</h3>
    <div id="adminEventsList"></div>
    <br>
    <a href="index.html">Back to Home</a>
  </div>

  <script>
    async function fetchAdminEvents() {
      const res = await fetch('/api/events');
      const events = await res.json();
      const list = document.getElementById('adminEventsList');
      list.innerHTML = '';
      events.forEach(evt => {
        list.innerHTML += `
          <div style="border-bottom: 1px solid #ddd; padding: 10px 0; display: flex; justify-content: space-between;">
            <span><strong>${evt.title}</strong> (${evt.date})</span>
            <button onclick="deleteEvent('${evt._id}')" style="background: red; color: white; border: none; padding: 5px 10px; cursor: pointer;">Delete</button>
          </div>
        `;
      });
    }

    document.getElementById('eventForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        title: document.getElementById('title').value,
        date: document.getElementById('date').value,
        time: document.getElementById('time').value,
        description: document.getElementById('desc').value
      };

      await fetch('/api/events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      document.getElementById('eventForm').reset();
      fetchAdminEvents();
    });

    async function deleteEvent(id) {
      if(confirm('Are you sure you want to delete this event?')) {
        await fetch(`/api/events/${id}`, { method: 'DELETE' });
        fetchAdminEvents();
      }
    }

    fetchAdminEvents();
  </script>
</body>
</html>
